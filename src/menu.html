<!-- HEADER -->
<header
  id="header"
  class="fixed z-50 flex w-full items-center justify-between bg-[#000000d4] px-4 py-4 backdrop-blur-md transition-colors duration-700"
>
  <a href="index.html" class="z-10 flex items-center gap-3">
    <img class="w-8" src="img/Logo_W.png" alt="Wojciech Trzpis" />
    <span class="font-sans text-sm font-medium tracking-wide text-white sm:text-base">
      Wojciech Trzpis
    </span>
  </a>

  <!-- DESKTOP MENU -->
  <div class="hidden items-center sm:flex" id="menu">
    <nav>
      <ul class="flex items-center justify-between gap-3 pt-0 font-sans text-lg text-gray-200">

        <!-- HOME -->
        <li>
          <a
            id="home-link"
            href="index.html"
            class="block rounded-full border-2 border-transparent px-4 py-1 font-semibold transition-colors duration-300 ease-in-out"
          >
            Home
          </a>
        </li>

        <!-- PROJECTS -->
        <li>
          <a
            id="projects-link"
            href="index.html#nextSection"
            class="block rounded-full border-2 border-transparent px-4 py-1 font-semibold transition-colors duration-300 ease-in-out hover:border-white/90 hover:text-white"
          >
            Projects
          </a>
        </li>

        <!-- RESUME -->
        <li>
          <a
            id="resume-link"
            href="src/resume.html"
            class="block rounded-full border-2 border-transparent px-4 py-1 font-semibold transition-colors duration-300 ease-in-out hover:border-white/90 hover:text-white"
          >
            Resume
          </a>
        </li>

      </ul>
    </nav>
  </div>

  <!-- MOBILE MENU BUTTON -->
  <button
    id="burger-btn"
    class="z-20 bg-transparent px-1.5 py-1 text-2xl text-white transition-colors duration-300 ease-in-out hover:bg-white/10 sm:hidden"
    aria-label="Open menu"
    aria-controls="mobile-menu"
    aria-expanded="false"
  >
    ☰
  </button>
</header>

<!-- MOBILE MENU -->
<div id="mobile-overlay" class="fixed inset-0 z-30 hidden sm:hidden">
  <div
    id="mobile-menu"
    class="invisible absolute left-0 top-16 w-full max-h-0 overflow-hidden bg-black/80 text-white opacity-0 backdrop-blur-md transition-all duration-300 ease-in-out scale-y-95"
  >
    <ul class="flex w-full flex-col items-start py-3 text-lg">

      <li class="w-full">
        <a
          href="index.html"
          id="mobile-home-link"
          class="block w-full px-6 py-3 font-light transition-colors duration-200 hover:bg-white/10 active:bg-white/20"
        >
          Home
        </a>
      </li>

      <li class="w-full">
        <a
          href="index.html#nextSection"
          id="mobile-projects-link"
          class="block w-full px-6 py-3 font-light transition-colors duration-200 hover:bg-white/10 active:bg-white/20"
        >
          Projects
        </a>
      </li>

      <li class="w-full">
        <a
          href="src/resume.html"
          id="mobile-resume-link"
          class="block w-full px-6 py-3 font-light transition-colors duration-200 hover:bg-white/10 active:bg-white/20"
        >
          Resume
        </a>
      </li>

    </ul>
  </div>
</div>
